name: Build Wolfenstein Enemy Territory Data

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install game-data-packager-runtime game-data-packager wget gdebi-core -y
          sudo apt install innoextract lgogdownloader

      - name: Patch game-data-packager Arch Linux Module (fixes error)
        run: |
          # Injects 'PackageRelation' into the relative import block of arch.py
          sudo sed -i 's/from \. import (PackagingSystem/from . import (PackagingSystem, PackageRelation/' /usr/share/games/game-data-packager/game_data_packager/packaging/arch.py
      - name: Download Enemy Territory from Trackbase
        run: |
          curl -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
               -L "http://filebase.trackbase.net/et/full/et260b.x86_full.zip" \
               -o et260b.x86_full.zip

      # 4. Generate packages for Arch, Debian, and RPM
      - name: Run game-data-packager for multiple formats
        run: |
          mkdir -p output
          
          echo "Building Debian package..."
          game-data-packager enemy-territory --target-format deb --destination ./output
          
          echo "Building Arch Linux package..."
          game-data-packager enemy-territory --target-format arch --destination ./output
          
          echo "Building RPM package..."
          game-data-packager enemy-territory --target-format rpm --destination ./output

      - name: Upload All Built Packages
        uses: actions/upload-artifact@v4
        with:
          name: enemy-territory-multi-distro-packages
          path: ./output/*
